<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>網頁翻譯</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <div class="mark" aria-hidden="true">譯</div>
        <div>
          <h1>網頁翻譯</h1>
          <p>Browser AI</p>
        </div>
      </header>
      <label class="provider-field" for="provider">
        <span>翻譯服務</span>
        <select id="provider">
          <option value="chatgpt">ChatGPT</option>
          <option value="m365">Microsoft 365 Copilot</option>
        </select>
      </label>
      <div class="option-grid">
        <label class="provider-field" for="scope">
          <span>翻譯範圍</span>
          <select id="scope">
            <option value="main">主要內容（建議）</option>
            <option value="page">整個頁面</option>
          </select>
        </label>
        <label class="provider-field" for="display-mode">
          <span>顯示方式</span>
          <select id="display-mode">
            <option value="bilingual">雙語對照</option>
            <option value="replace">只顯示翻譯</option>
          </select>
        </label>
      </div>
      <section class="status-card" aria-live="polite">
        <span id="status-dot" class="dot pending"></span>
        <div>
          <strong id="status-title">檢查連線中…</strong>
          <p id="status-detail">請先選擇 ChatGPT 或 Microsoft 365 Copilot</p>
        </div>
      </section>
      <div id="progress" class="progress" hidden>
        <div id="progress-bar"></div>
      </div>
      <div class="actions">
        <button id="translate" class="primary" disabled>翻譯目前頁面</button>
        <button id="connect" class="primary" hidden>開啟登入分頁</button>
        <button id="restore" class="secondary">恢復原文</button>
      </div>
      <p id="error" class="error" role="alert" hidden></p>
      <p class="privacy">只傳送段落純文字、穩定 ID 與最小語意提示，不傳送整頁 HTML、DOM、Cookie 或登入資料。</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
