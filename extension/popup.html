<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>網頁翻譯</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <div class="mark" aria-hidden="true">譯</div>
        <div>
          <h1>網頁翻譯</h1>
          <p>Browser AI</p>
        </div>
      </header>
      <label class="provider-field" for="provider">
        <span>翻譯服務</span>
        <select id="provider">
          <option value="chatgpt">ChatGPT</option>
          <option value="m365">Microsoft 365 Copilot</option>
        </select>
      </label>
      <section class="status-card" aria-live="polite">
        <span id="status-dot" class="dot pending"></span>
        <div>
          <strong id="status-title">檢查連線中…</strong>
          <p id="status-detail">正在尋找翻譯服務分頁</p>
        </div>
      </section>
      <div id="progress" class="progress" hidden>
        <div id="progress-bar"></div>
      </div>
      <div class="actions">
        <button id="translate" class="primary" disabled>翻譯目前頁面</button>
        <button id="connect" class="primary" hidden>開啟登入分頁</button>
        <button id="restore" class="secondary">恢復原文</button>
      </div>
      <p id="error" class="error" role="alert" hidden></p>
      <p class="privacy">只把可見英文純文字送到你選擇且已登入的服務分頁，不傳送整頁 HTML。</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
